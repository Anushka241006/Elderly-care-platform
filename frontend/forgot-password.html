<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Care24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="forgot-password">
  <main class="auth-shell">
    <section class="auth-card wide">
      <h1>Reset Password</h1>
      <p class="muted">Step 1: Generate reset token using your registered email.</p>
      <form id="requestResetForm" class="form-grid two-col">
        <label>Email
          <input type="email" id="resetEmail" placeholder="Enter account email" required>
        </label>
        <div></div>
        <button type="submit" class="btn btn-primary">Generate Token</button>
      </form>
      <p id="resetTokenPreview" class="muted"></p>

      <p class="muted">Step 2: Enter token and set new password.</p>
      <form id="confirmResetForm" class="form-grid two-col">
        <label>Reset Token
          <input type="text" id="resetToken" placeholder="Paste token here" required>
        </label>
        <label>New Password
          <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
        </label>
        <button type="submit" class="btn btn-primary">Reset Password</button>
      </form>
      <p class="muted"><a href="login.html">Back to login</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
